name: Check Fly secret

# Temporary: confirms the FLY_API_TOKEN secret exists and Fly accepts it. Read-only, deploys nothing.
on:
  push:
    branches: ['claude/phone-functionality-explanation-4j3qe7']
    paths: ['.github/workflows/check-fly-secret.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Secret is set
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then echo "FLY_API_TOKEN is not set"; exit 1; fi
          echo "FLY_API_TOKEN is set"
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Fly accepts the token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl status --app guitar-price-api
